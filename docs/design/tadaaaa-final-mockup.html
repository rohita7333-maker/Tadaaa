<style>
/* Hallmark · macrostructure: source-DNA (user reference "TaDaaaa App.html") · studied: yes
 * theme: studied-DNA (Figtree 800 · ink #1A1B18 · paper #FAF9F6 · pine #3E6B5C · 8px)

:root{
  --ink:#1A1B18; --paper:#FAF9F6; --pine:#3E6B5C; --pine-deep:#2E5145;
  --card:#FFFFFF; --line:#E9E6DF; --mut:#6F6E68; --soft:#F1EFE9;
  --amber:#C98A2D; --danger:#B04A3A;
  --r-s:8px; --r-m:14px; --r-l:22px; --r-pill:999px;
  --sh:0 1px 2px rgba(26,27,24,.05); --sh-l:0 14px 40px rgba(26,27,24,.10);
  --f:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
body{font-family:var(--f);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.03em;line-height:1.08;font-style:normal}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pine)}
.mut{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;border-radius:var(--r-s);padding:11px 20px;min-height:42px;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-pine{background:var(--pine);color:#fff}
.btn-pine:hover{background:var(--pine-deep)}
.btn-line{background:var(--card);border:1px solid var(--line)}
.btn-line:hover{border-color:var(--ink)}
.btn-ghost{color:var(--mut);padding:11px 10px}
.btn-ghost:hover{color:var(--ink)}
.btn-sm{padding:7px 14px;min-height:34px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh)}
.pill{font-size:11px;font-weight:600;border-radius:var(--r-pill);padding:3px 10px;letter-spacing:.03em}
.pill-live{background:#E7EFEA;color:var(--pine-deep)}
.pill-sched{background:var(--soft);color:var(--mut)}
.pill-new{background:var(--pine);color:#fff;font-size:10px}
svg{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* nav */
.nav{position:sticky;top:0;background:rgba(250,249,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:50}
.nav .wrap{display:flex;align-items:center;gap:26px;height:60px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--pine)}
.navlinks{display:flex;gap:22px;font-size:13.5px;font-weight:500;color:var(--mut);margin:0 auto}
.navlinks a:hover{color:var(--ink)}
.navlinks a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--pine)}
.nav .right{display:flex;gap:10px;align-items:center;margin-left:auto}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.demobar{background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:5px 10px}
.demobar b{color:#A8C3B4;font-weight:600}

/* landing */
.hero{padding:84px 0 40px;text-align:center}
.hero h1{font-size:clamp(38px,5.4vw,62px);max-width:16ch;margin:14px auto 18px;overflow-wrap:anywhere}
.hero .sub{font-size:16.5px;color:var(--mut);max-width:46ch;margin:0 auto 26px}
.ctarow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.trust{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:26px;font-size:12.5px;color:var(--mut)}
.trust span{display:flex;align-items:center;gap:6px}
.trust svg{width:13px;height:13px;color:var(--pine)}
.phonewrap{display:flex;justify-content:center;padding:36px 0 72px}
.phone{width:300px;aspect-ratio:9/18.6;background:#fff;border-radius:38px;box-shadow:var(--sh-l),0 0 0 1px var(--line);padding:12px;display:flex}
.phone .scr,.prevphone .scr{flex:1;border-radius:28px;background:var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 18px;gap:0;position:relative}
.scr .occ{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#C7B9A5}
.scr h3{color:#fff;font-size:22px;margin:8px 0 4px}
.scr .from{font-size:10px;color:#8F8A81;margin-bottom:16px}
.scr .pola{width:150px;background:#fff;border-radius:6px;padding:6px 6px 8px;transform:rotate(-3deg);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.scr .pola .im{aspect-ratio:4/3;border-radius:3px;background:var(--soft) center/cover}
.scr .pola figcaption{font-size:9px;color:var(--mut);padding-top:6px;text-align:left}
.scr .cd{margin-top:18px}
.scr .cd .lbl{font-size:8px;letter-spacing:.2em;color:#C7B9A5;text-transform:uppercase}
.scr .cd .digits{font-size:24px;font-weight:800;color:#fff;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.scr .hint{position:absolute;bottom:16px;left:0;right:0;font-size:9px;color:#8F8A81}
.musicpill{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:5px;font-size:9px;color:#C7B9A5;border:1px solid rgba(199,185,165,.35);border-radius:var(--r-pill);padding:4px 9px}
.musicpill svg{width:10px;height:10px}
.sec{padding:72px 0}
.sec-head{max-width:52ch;margin-bottom:36px}
.sec-head h2{font-size:clamp(26px,3.2vw,36px);margin-bottom:10px}
.sec-head p{color:var(--mut);font-size:15px}
.center{text-align:center}.center .sec-head{margin-left:auto;margin-right:auto}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.occard{padding:20px;text-align:left}
.occard h4{font-size:15px;font-weight:700;margin:10px 0 3px;letter-spacing:-.01em}
.occard p{font-size:12.5px;color:var(--mut);line-height:1.5}
.occard svg{width:22px;height:22px;color:var(--pine)}
.stepno{font-size:12px;font-weight:800;color:var(--pine);letter-spacing:.06em}
.stepcard{padding:24px}
.stepcard h4{font-size:16px;margin:10px 0 6px}
.stepcard p{font-size:13.5px;color:var(--mut)}
.revcard{padding:22px;position:relative;cursor:pointer;transition:border-color .15s,transform .15s}
.revcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.revcard .shot{height:92px;border-radius:var(--r-s);background:var(--ink);margin-bottom:14px;display:flex;align-items:center;justify-content:center;color:#C7B9A5;overflow:hidden;position:relative}
.revcard h4{font-size:15px;display:flex;gap:8px;align-items:center}
.revcard p{font-size:12.5px;color:var(--mut);margin-top:4px}
.contribpanel{padding:26px;max-width:420px}
.contribpanel .hd{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.feeditem{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--soft);font-size:13.5px}
.feeditem .dot{width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--pine-deep);flex-shrink:0}
.feeditem time{margin-left:auto;font-size:10.5px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.quote{padding:24px}
.quote p{font-size:15px;line-height:1.55;margin-bottom:14px}
.quote .who{font-size:12.5px;color:var(--mut);font-weight:600}
.excard{overflow:hidden;cursor:pointer;transition:transform .15s}
.excard:hover{transform:translateY(-2px)}
.excard .im{aspect-ratio:16/10;background:var(--soft) center/cover}
.excard .bd{padding:14px 16px}
.excard h4{font-size:14.5px}
.excard p{font-size:12px;color:var(--mut)}
.ctaband{background:var(--ink);border-radius:var(--r-l);padding:56px 32px;text-align:center;color:#fff}
.ctaband h2{font-size:clamp(26px,3.4vw,38px);color:#fff;margin-bottom:8px}
.ctaband p{color:#B7B3AA;margin-bottom:22px;font-size:15px}
.foot{border-top:1px solid var(--line);padding:32px 0 44px;display:flex;gap:22px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.foot .logo{font-size:16px}
.foot .cr{margin-left:auto}

/* app screens */
.page{padding:44px 0 90px}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.pagehead h1{font-size:30px}
.pagehead .sub{font-size:13.5px;color:var(--mut);margin-top:4px}
.pagehead .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.srow{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px}
.srow .thumb{width:52px;height:52px;border-radius:var(--r-s);background:var(--soft) center/cover;flex-shrink:0}
.srow .m{flex:1;min-width:0}
.srow h4{font-size:14.5px;letter-spacing:-.01em}
.srow p{font-size:12px;color:var(--mut)}
.ibrow{display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:var(--r-s);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--mut)}
.ib:hover{border-color:var(--ink);color:var(--ink)}
.ib svg{width:15px;height:15px}
.twocol{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.panel{padding:20px 22px}
.panel h3{font-size:16px;margin-bottom:14px}
.needsrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--soft);font-size:13px}
.needsrow b{font-weight:700}
.needsrow .msg{color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:7px;height:110px;padding-top:6px}
.bars .b{flex:1;background:var(--pine);border-radius:3px 3px 0 0;min-height:4px;position:relative;opacity:.92}
.bars .b span{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--mut)}
.hbar{margin-bottom:12px}
.hbar .lbl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.hbar .tr{height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.hbar .fl{height:100%;background:var(--pine);border-radius:4px}
.geo .g{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--soft);font-size:13.5px}
.geo .g:last-child{border:0}
.geo .cc{font-size:9.5px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--mut)}
.geo b{margin-left:auto}
.fun .f{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fun .fl2{width:86px;font-size:11.5px;color:var(--mut)}
.fun .fb{height:22px;background:var(--pine);border-radius:4px;color:#fff;display:flex;align-items:center;padding-left:9px;font-size:11px;min-width:40px}
.ctable{width:100%;border-collapse:collapse;font-size:13.5px}
.ctable th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:700}
.ctable td{padding:11px 6px;border-bottom:1px solid var(--soft)}
.honest{display:flex;gap:10px;margin-top:16px;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:var(--r-s);padding:12px 14px;font-size:12.5px;color:var(--mut)}
.honest svg{width:14px;height:14px;flex-shrink:0;margin-top:2px;color:var(--amber)}

/* create */
.wizgrid{display:grid;grid-template-columns:1fr 320px;gap:36px;align-items:start}
.steps{display:flex;gap:6px;margin-bottom:26px}
.steps .s{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps .s.on{background:var(--pine)}
.steplbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pine);margin-bottom:14px}
.wiz h2{font-size:24px;margin-bottom:4px}
.wiz .sub{font-size:13.5px;color:var(--mut);margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-s);font-size:14px;font-family:inherit;background:var(--card);color:var(--ink)}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 1px var(--pine)}
.field .btn{white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 15px;background:var(--card)}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.photorow{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.pht{width:104px}
.pht .im{aspect-ratio:1;border-radius:var(--r-s);background:var(--soft) center/cover;border:1px solid var(--line)}
.pht input{width:100%;border:none;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--mut);padding:5px 2px;background:transparent}
.phadd{width:104px;aspect-ratio:1;border:1px dashed var(--line);border-radius:var(--r-s);display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
.phadd:hover{border-color:var(--pine);color:var(--pine)}
.tglrow{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--soft)}
.tglrow .m{flex:1}
.tglrow h4{font-size:14px;font-weight:700;letter-spacing:0}
.tglrow p{font-size:12.5px;color:var(--mut)}
.tracks{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.track{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 13px;font-size:13.5px;cursor:pointer;background:var(--card)}
.track:hover{border-color:var(--mut)}
.track.on{border:2px solid var(--pine);padding:9px 12px}
.track .pb{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--pine)}
.track .pb svg{width:11px;height:11px}
.track .nm{font-weight:600}
.track .desc{color:var(--mut);font-size:12px}
.track .tag{margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.recbox{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;margin-top:10px}
.recbox .thumb{width:72px;height:48px;border-radius:6px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;flex-shrink:0}
.recbox .thumb svg{width:16px;height:16px}
.recbox .dur{position:absolute;bottom:3px;right:5px;font-size:8.5px;color:#C7B9A5}
.rsel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rcard{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;cursor:pointer;position:relative;background:var(--card)}
.rcard:hover{border-color:var(--mut)}
.rcard.on{border:2px solid var(--pine);padding:13px}
.rcard h4{font-size:13.5px;display:flex;gap:6px;align-items:center}
.rcard p{font-size:11.5px;color:var(--mut);margin-top:3px}
.oncheck{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--pine);display:none;align-items:center;justify-content:center}
.rcard.on .oncheck{display:flex}
.oncheck svg{width:10px;height:10px;stroke:#fff;stroke-width:2.4}
.lrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 13px;margin-bottom:8px;font-size:13.5px}
.lrow svg{width:15px;height:15px;color:var(--pine);flex-shrink:0}
.laddr{border:1px dashed var(--line);border-radius:var(--r-s);padding:10px 13px;font-size:13px;color:var(--mut);cursor:pointer}
.laddr:hover{border-color:var(--pine);color:var(--pine)}
.sw{position:relative;width:42px;height:24px;flex-shrink:0}
.sw input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2;width:100%;height:100%}
.sw .tr2{position:absolute;inset:0;background:var(--line);border-radius:12px;transition:background .15s}
.sw .tr2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--sh);transition:left .15s}
.sw input:checked + .tr2{background:var(--pine)}
.sw input:checked + .tr2::after{left:21px}
.wnav{display:flex;gap:10px;margin-top:26px}
.wnav .btn-pine{margin-left:auto}
.sumrow{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--soft)}
.sumrow .k{color:var(--mut)}
.gatecard{border:1px solid var(--line);border-left:3px solid var(--pine);border-radius:var(--r-s);padding:16px;margin:16px 0;background:var(--card)}
.gatecard h4{font-size:14px;margin-bottom:4px}
.gatecard p{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.prevcol{position:sticky;top:80px}
.prevphone{width:100%;max-width:300px;margin:0 auto;aspect-ratio:9/17.5;background:#fff;border-radius:32px;box-shadow:var(--sh-l),0 0 0 1px var(--line);padding:10px;display:flex}
.prevphone .scr{border-radius:24px}
.prevcap{text-align:center;font-size:11.5px;color:var(--mut);margin-top:12px;line-height:1.5}
.qrbox{width:170px;height:170px;margin:14px auto;border:1px solid var(--line);border-radius:var(--r-m);padding:11px;background:#fff}
.copyrow{display:flex;gap:8px;max-width:400px;margin:0 auto 14px}
.copyrow input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);font-size:12.5px;color:var(--mut);background:var(--soft);font-family:inherit}

/* reveal */
.rvwrap{min-height:calc(100vh - 92px);background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative}
.rv{max-width:420px;width:100%;text-align:center}
.rv .occ{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#C7B9A5}
.rv h1{color:#fff;font-size:32px;margin:10px 0 6px}
.rv .from{font-size:12px;color:#8F8A81}
.giftbtn{width:104px;height:104px;border-radius:50%;border:1px solid rgba(199,185,165,.4);margin:36px auto 12px;display:flex;align-items:center;justify-content:center;color:#C7B9A5;animation:breathe 2.4s ease-in-out infinite}
.giftbtn svg{width:34px;height:34px}
@keyframes breathe{50%{transform:scale(1.05);opacity:.75}}
.rv .taplbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8F8A81}
.rvpola{width:230px;margin:18px auto;background:#fff;border-radius:6px;padding:8px 8px 10px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.rvpola .im{aspect-ratio:4/3;border-radius:4px;background:var(--soft) center/cover}

function tone(f,t,dur,vol){const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function playPreview(id){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const sc=SCALES[id]||SCALES.keys, t0=AC.currentTime+.03;

function drawQR(el,seedStr){const N=25;let seed=0;for(const ch of seedStr)seed=(seed*31+ch.charCodeAt(0))%2147483647;const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648};let cells="";const F=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||i===6||j===0||j===6,co=i>1&&i<5&&j>1&&j<5;if(e||co)cells+='<rect x="'+(x+j)+'" y="'+(y+i)+'" width="1" height="1"/>'}};F(0,0);F(N-7,0);F(0,N-7);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const inF=(x<9&&y<9)||(x>=N-9&&y<9)||(x<9&&y>=N-9);if(!inF&&rnd()<.45)cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}el.innerHTML='<svg viewBox="0 0 25 25" width="100%" height="100%" shape-rendering="crispEdges"><g fill="#1A1B18" stroke="none">'+cells+'</g></svg>';}
let cdTarget=Date.now()+(14*3600+6*60+32)*1000;
function cdStr(){let s=Math.max(0,Math.floor((cdTarget-Date.now())/1000));const h=String(Math.floor(s/3600)).padStart(2,"0"),m=String(Math.floor(s%3600/60)).padStart(2,"0"),ss=String(s%60).padStart(2,"0");return h+" : "+m+" : "+ss;}
setInterval(()=>{document.querySelectorAll("[data-cd]").forEach(e=>e.textContent=cdStr())},1000);
function dodge(e){const b=e.currentTarget,r=b.parentElement.getBoundingClientRect();const dx=(Math.random()*160-80),dy=(Math.random()*70-35);b.style.transform="translate("+dx+"px,"+dy+"px)";b.dataset.d=(+b.dataset.d||0)+1;if(+b.dataset.d>=3){b.style.transform="none";b.onmouseenter=null;b.textContent="Fine — No";}}

  +'<div class="card tier"><h3>Free</h3><div class="price">$0</div><div class="per">forever</div><ul>'+li("2 surprises a month")+li("All four reveal styles")+li("Contributions & approvals")+li("28-day page life after open")+'</ul><a class="btn btn-line" href="#auth">Start free</a></div>'
  +'<div class="card tier hot"><h3>Plus</h3><div class="price">$4.99</div><div class="per">per surprise, once</div><ul>'+li("Premium themes & templates")+li("Music on the reveal")+li("60-second video message")+li("Designer art & collage downloads")+li("Page never expires")+'</ul><a class="btn btn-pine" href="#auth">Unlock at publish</a></div>'
  +'<div class="card tier"><h3>Unlimited</h3><div class="price">$19.99</div><div class="per">per year</div><ul>'+li("Everything in Plus")+li("Unlimited surprises")+li("Full analytics history")+li("Priority render queue")+'</ul><a class="btn btn-line" href="#auth">Go Unlimited</a></div>'
  +'<div class="card tier"><h3>Gift</h3><div class="price">$5</div><div class="per">one Plus surprise, gifted</div><ul>'+li("Send Plus to a friend")+li("Delivered by magic link")+li("90-day redemption")+'</ul><a class="btn btn-line" href="#auth">Gift it</a></div>'
  +'</div>'
  +'<div class="card panel" style="max-width:640px;margin:26px auto 0"><h3>Fair questions</h3>'
  +'<div class="tglrow"><div class="m"><h4>What happens on the free plan after they open it?</h4><p>The page stays live for 28 days after the first open — long enough for everyone to see it. Plus pages never expire.</p></div></div>'
  +'<div class="tglrow"><div class="m"><h4>Is the music licensed?</h4><p>Yes — the library is curated and licensed for exactly this. No uploads, no takedowns, no surprises.</p></div></div>'
  +'</div></div>';
}

function vSettings(){
  const row=(h,p,c)=>'<div class="setrow'+(c||"")+'"><div class="m"><h4>'+h+'</h4><p>'+p+'</p></div>'+(c===" danger"?'<button class="btn btn-line btn-sm" style="color:var(--danger);border-color:var(--danger)" onclick="toast(\'Type DELETE to confirm — in the real app\')">Delete</button>':'<label class="sw"><input type="checkbox" checked><span class="tr2"></span></label>')+'</div>';
  return '<div class="page wrap" style="max-width:560px"><div class="pagehead"><div><h1>Settings</h1><div class="sub">rohit@example.com · Plus</div></div></div>'
  +'<div class="card" style="padding:6px 22px">'
  +row("Email me when someone opens a surprise","First view only — never per view.")
  +row("Email me on RSVPs and answers","The good stuff, as it happens.")
  +row("Occasion reminders","A nudge before birthdays you\'ve celebrated here.")
  +'<div class="setrow"><div class="m"><h4>Change password</h4><p>Current password required.</p></div><button class="btn btn-line btn-sm" onclick="toast(\'Password form (mock)\')">Change</button></div>'
  +'<div class="setrow"><div class="m"><h4>Download my data</h4><p>Everything, as JSON. GDPR-grade.</p></div><button class="btn btn-line btn-sm" onclick="toast(\'Export queued (mock)\')">Export</button></div>'
  +row("Delete account","Removes every surprise, photo and video. No undo."," danger")
  +'</div></div>';
}

/* ---------- router ---------- */
function render(){
  stopMusic();
  const h=(location.hash||"#landing").slice(1);
  const [route,arg]=h.split("/");
  document.getElementById("navc").innerHTML=navHtml(route);
  const app=document.getElementById("app");
  if(route==="landing")app.innerHTML=vLanding();
  else if(route==="auth")app.innerHTML=vAuth();
  else if(route==="dashboard"){S.authed=true;app.innerHTML=vDashboard();}
  else if(route==="analytics"){S.authed=true;app.innerHTML=vAnalytics();}
  else if(route==="create"){S.authed=true;app.innerHTML=vCreate();const q=document.getElementById("pubqr");if(q)drawQR(q,"maya-turns-thirty");}
  else if(route==="reveal"){if(arg==="tap"&&location.hash!==render._last)S.tapStage=0;if(arg==="letters")S.letterOpen=S.letterOpen;app.innerHTML=vReveal(arg||"scroll");}
  else if(route==="contribute")app.innerHTML=vContribute();
  else if(route==="templates")app.innerHTML=vTemplates();
  else if(route==="pricing")app.innerHTML=vPricing();
  else if(route==="settings"){S.authed=true;app.innerHTML=vSettings();}
  else app.innerHTML=vLanding();
  render._last=location.hash;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script>
